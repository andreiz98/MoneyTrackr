{% extends "base.html" %}

{% block content %}

    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body">
                    <h3 class="text-center mb-3">Set new password</h3>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button class="btn btn-success w-100">Change password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

{% endblock %}
