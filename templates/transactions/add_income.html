{% extends "base.html" %}
{% load static %}

{% block title %}Add Income{% endblock %}

{% block content %}
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header text-center fw-bold">Add Income</div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-success w-100" type="submit">Add</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
